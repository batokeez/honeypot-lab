<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Honeypot Dashboard</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 2rem;
        }

        h1 {
            color: #38bdf8;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #1e293b;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            min-width: 140px;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        section {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
            font-weight: normal;
            font-size: 0.85rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .bar-label {
            width: 220px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .bar {
            background: #38bdf8;
            height: 18px;
            border-radius: 3px;
        }

        .bar-count {
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <h1>Honeypot Dashboard</h1>
    <div class="stats" id="stat-cards"></div>

    <section>
        <h2>Credenciais mais tentadas</h2>
        <div id="credentials-chart"></div>
    </section>

    <section>
        <h2>Comandos mais executados</h2>
        <div id="commands-chart"></div>
    </section>

    <script>
        fetch("/api/stats")
            .then(res => res.json())
            .then(data => renderDashboard(data));

        function renderDashboard(data) {
            // Cartões de resumo no topo
            const cards = [
                { label: "Total de eventos", value: data.totalEvents },
                { label: "Sessões únicas", value: data.uniqueSessions },
                { label: "Logins com sucesso", value: data.successCount },
                { label: "Logins falhados", value: data.failedCount },
            ];
            document.getElementById("stat-cards").innerHTML = cards.map(c => `
        <div class="stat-card">
          <div class="number">${c.value}</div>
          <div class="label">${c.label}</div>
        </div>
      `).join("");

            renderBarChart("credentials-chart", data.credentialCounts);
            renderBarChart("commands-chart", data.commandCounts);
        }

        function renderBarChart(containerId, counts) {
            const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const max = Math.max(...entries.map(e => e[1]));

            const html = entries.map(([label, count]) => {
                const widthPercent = (count / max) * 100;
                return `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar" style="width: ${widthPercent}%"></div>
            <div class="bar-count">${count}</div>
          </div>
        `;
            }).join("");

            document.getElementById(containerId).innerHTML = html;
        }
    </script>
</body>

</html>
